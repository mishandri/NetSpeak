# Сборка NetSpeak под Linux.
#
# Работает само: при пуше тега (client-v… или server-v…) собирает бинарники
# на серверах GitHub и кладёт их в тот же релиз. Ни Linux на этой машине,
# ни Docker, ни WSL для этого не нужны — всё происходит на стороне GitHub.
#
# Почему не на своей машине: PyInstaller не умеет собирать Linux из
# Windows, а ставить WSL ради одной сборки — лишняя морока и перезагрузка.
name: Сборка Linux

on:
  push:
    tags:
      - 'client-v*'
      - 'server-v*'
  # Ручной запуск: Actions → Сборка Linux → Run workflow
  workflow_dispatch:

permissions:
  contents: write          # нужно, чтобы дописать файлы в релиз

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Окно под Linux рисует GTK через WebKit2. Без этих пакетов
      # pywebview запускается, но окно не появляется.
      - name: Системные пакеты для окна
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 \
            patchelf

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt

      - name: Собрать
        run: python build_linux.py

      - name: Приложить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin-linux/NetSpeakServer
            bin-linux/NetSpeak
