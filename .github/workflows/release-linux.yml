# Сборка NetSpeak под Linux.
#
# Работает само: при пуше тега собирает бинарники на серверах GitHub и
# кладёт их в релиз этого тега. Ни Linux на этой машине, ни Docker, ни WSL
# для этого не нужны — всё происходит на стороне GitHub.
#
# Почему не на своей машине: PyInstaller не умеет собирать Linux из
# Windows, а ставить WSL ради одной сборки — лишняя морока и перезагрузка.
#
# Теги:
#   client-v… и server-v… — обычные релизы. Под Linux такие же файлы
#     собираются рядом с виндовыми, и раз обновлялка ищет .exe, Linux их
#     не видит и просто не обновляется.
#   linux-v… — пробная сборка. Номер берётся любой, лишь бы не совпал с
#     уже занятым тегом, и обновлялка его в упор не смотрит: префикс
#     другой. Удобно, пока Linux не проверен вживую.
name: Сборка Linux

on:
  push:
    tags:
      - 'client-v*'
      - 'server-v*'
      - 'linux-v*'
  # Ручной запуск: Actions → Сборка Linux → Run workflow.
  # Кнопка появляется только если этот файл лежит в основной ветке —
  # GitHub показывает там то, что есть в ней, а не во всех.
  workflow_dispatch:

permissions:
  contents: write          # нужно, чтобы дописать файлы в релиз

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Мост между Python и GTK — python3-gi. Он ставится системой и
      # к СИСТЕМНОМУ Python, поэтому setup-python здесь и не нужен, и
      # вреден: поставил бы Python из запаса, и модуль остался бы не
      # там, где его ищет сборка. Именно так и вышло у человека:
      # «No module named 'gi'».
      #
      # Имена webkit и libsoup различаются между 22.04 и 24.04, а
      # ЧУЖОГО ИМЕНИ apt НЕ ЗНАЕТ: попросишь оба — установка свалится
      # целиком. Поэтому версии ставятся по отдельности, и не
      # нашедшаяся просто пропускается; какая из двух нужна, проверяет
      # следующий шаг.
      - name: "Системные пакеты: мост к GTK и окно"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 libgtk-3-0 patchelf
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.0 gir1.2-soup-2.4 libwebkit2gtk-4.0-37 || true
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.1 gir1.2-soup-3.0 libwebkit2gtk-4.1-0 || true
          # значок в трее — по желанию: без него программа работает
          sudo apt-get install -y --no-install-recommends \
            gir1.2-ayatanaappindicator3-0.1 || true

      # Проверка ровно того, на чём всё и держится. Без неё сборка
      # «успешно» пройдёт и выдаст бинарник, который падает при запуске.
      - name: Мост между Python и GTK на месте?
        run: |
          python3 - <<'PY'
          import sys
          import gi
          gi.require_version('Gtk', '3.0')
          print('Gtk: ок')
          найден = False
          for версия in ('4.1', '4.0'):
              try:
                  gi.require_version('WebKit2', версия)
                  print(f'WebKit2 {версия}: ок')
                  найден = True
              except ValueError:
                  print(f'WebKit2 {версия}: нет')
          if not найден:
              sys.exit('ни одной версии WebKit2 — окно открывать нечем')
          PY

      # venv с доступом к системным пакетам: иначе gi из
      # dist-packages не виден и снова уезжает мимо сборки.
      - name: Окружение сборки
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Зависимости
        run: pip install -r requirements-linux.txt

      - name: Собрать
        run: python build_linux.py

      - name: Приложить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin-linux/NetSpeakServer
            bin-linux/NetSpeak
